const all=()=>C.map(x=>({...x,c:1})).concat(T);
const rnd=n=>{const m=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=m);return a[0]%n+1};
const norm=v=>v.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let tabT="d",q=1,mod=0,adv=0,res=null,H=[],view=null,ed=null,lr=-1,query="";
const sum=a=>a.reduce((u,v)=>u+v,0);
function go(n){
 const one=()=>[rnd(n)];
 let tot=0,nat1=false,det=[];
 for(let i=0;i<q;i++){let a=one(),note="";
  if(adv&&q==1){const b=one();a=(adv>0?sum(a)>=sum(b):sum(a)<=sum(b))?a:b;note=" (2 dados)"}
  if(i==0&&a[0]==1&&n<=12)nat1=true;
  tot+=sum(a);det.push(a.join("+")+note)}
 const lbl=q+"d"+n+(mod?(mod>0?"+":"")+mod:"")+(adv&&q==1?(adv>0?" vantagem":" desvantagem"):"");
 res={lbl,tot:tot+mod,det:det.join(" | "),nat1};
 H.unshift(lbl+": "+(tot+mod));H=H.slice(0,15);drawT();tumble(n);buzz(nat1);try{window.OBroll&&OBroll((s.nome||"Alguém")+" · "+lbl+": "+(tot+mod)+(nat1?" — Natural 1! Encrenca!":""),nat1)}catch(e){}}
function lst(){
 const n=norm(query.trim());
 const r=all().map(x=>{const th=norm(x.t).includes(n),ih=n&&x.i.find(y=>norm(y).includes(n));return th||ih?{x,s:th?"":ih}:null}).filter(Boolean);
 document.getElementById("lst").innerHTML=r.length?"<ul>"+r.map(({x,s})=>`<li><button class="t" style="border:0;background:none;padding:0" onclick="view='${x.id}';lr=-1;drawT()"><span>${esc(x.t)}${s?"<br><em>item: "+esc(s)+"</em>":""}</span><em>${x.c?"sua · ":""}d${x.i.length}</em></button></li>`).join("")+"</ul>":`<p class="hint">Nenhuma tabela encontrada. Tente outra palavra ou crie uma tabela nova.</p>`}
function rollT(){const t=all().find(x=>x.id==view);lr=rnd(t.i.length)-1;drawT()}
function cnt(){const n=document.getElementById("ei").value.split("\n").filter(x=>x.trim()).length;document.getElementById("ec").textContent=n+" de 20 itens"+(n>20?" (passou do limite)":"")}
function saveT(){
 const t=document.getElementById("et").value.trim(),i=document.getElementById("ei").value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(!t)return alert("Dê um nome à tabela.");
 if(i.length<2)return alert("Coloque pelo menos 2 itens.");
 if(i.length>20)return alert("Máximo de 20 itens por tabela. Remova "+(i.length-20)+".");
 if(ed.id){const x=C.find(y=>y.id==ed.id);x.t=t;x.i=i}else{ed.id="c"+Date.now();C.unshift({id:ed.id,t,i})}
 svC();view=ed.id;ed=null;lr=-1;drawT()}
function delT(){if(confirm("Apagar esta tabela?")){C=C.filter(x=>x.id!=view);svC();view=null;drawT()}}
function drawT(){
 document.getElementById("navT").innerHTML=[["d","Dados"],["t","Tabelas"]].map(x=>`<button class="${tabT==x[0]?"on":""}" onclick="tabT='${x[0]}';view=null;ed=null;drawT()">${x[1]}</button>`).join("");
 let h="";
 if(tabT=="d")h=`<div class="g">${[4,6,8,10,12,20].map(n=>`<button class="d" onclick="go(${n})">d${n}</button>`).join("")}</div>

  return o}
 function unpack(o){
  return Object.assign(blank(),{nome:o.n||"",apelido:o.a||"",raca:o.r||"Humano",classe:o.c||"Briguento",nivel:o.l||1,
   M:o.M|0,R:o.R|0,I:o.I|0,L:o.L|0,vida:o.v|0,vidaMax:o.V|0,pm:o.p|0,pmMax:o.P|0,ps:o.s|0,arm:o.ar|0,cobres:o.co|0,
   pericias:o.pe||"",talentos:o.ta||"",magias:o.ma||"",notas:o.no||"",itens:o.it||[],grim:o.gr||[],cm:o.cm||[],h:[]})}
 function vazia(f){return !f.nome&&!(f.h&&f.h.length)}

 /* jogador -> sala */
 window.OBpush=function(){if(!ob.pronto)return;clearTimeout(tm);tm=setTimeout(enviar,800)};
 function enviar(){
  if(vazia(s))return;
  var o=pack(s),k=JSON.stringify(o,semT);
  if(k===ultimo)return;
  ultimo=k;
  var u={};u[PRE+ob.id]=o;
  OBR.room.setMetadata(u).catch(function(){
   ultimo="";
   if(!avisouErro){avisouErro=true;toastL("Não consegui sincronizar a ficha com a sala (limite de espaço?).")}})}

 /* sala -> mestre */
 function lerMeta(meta){
  var f={};
  Object.keys(meta||{}).forEach(function(k){if(k.indexOf(PRE)===0)f[k.slice(PRE.length)]=meta[k]});
  ob.fichas=f;ob.bytes=by(meta||{});
  if(typeof topTab!=="undefined"&&topTab==="o")OBdraw()}

 /* se o navegador do iframe perdeu a ficha local, recupera a cópia da sala */
 function restaurar(){
  var c=ob.fichas[ob.id];
  if(!c||!vazia(s))return;
  s=unpack(c);FL.list[FL.cur]=s;
  ultimo=JSON.stringify(pack(s),semT);
  save();drawF();toastL("Ficha recuperada da sala.")}

 function card(o){
  var pv=o.V>0?Math.max(0,Math.min(100,Math.round(o.v/o.V*100))):0,cor=pv<=30?"#d9503c":"var(--ac)";
  var mag=(o.gr||[]).map(function(n){var u=(o.cm||[]).filter(function(x){return x.n==n})[0];return esc(n)+(u?" (sua: "+esc(u.pm)+" PM)":"")}).join(", ");
  var it=(o.it||[]).map(function(x){return esc(x)}).join(", ");
  return '<div class="pc"><div class="ph"><b>'+esc(o.n||"Sem nome")+(o.a?" “"+esc(o.a)+"”":"")+'</b><span>'+esc(o.r)+" "+esc(o.c)+" · nível "+esc(o.l)+'</span></div>'
   +'<div class="hh">Jogador: '+esc(o.w||"?")+'</div>'
   +'<div class="bar"><i style="width:'+pv+'%;background:'+cor+'"></i></div>'
   +'<div class="st"><div><b>'+esc(o.v)+"/"+esc(o.V)+'</b>Vida</div><div><b>'+esc(o.p)+"/"+esc(o.P)+'</b>PM</div><div><b>'+esc(o.s)+'</b>Sorte</div><div><b>+'+esc(o.ar)+'</b>Armad.</div></div>'
   +'<div class="st"><div><b>'+esc(o.M)+'</b>Músculo</div><div><b>'+esc(o.R)+'</b>Reflexo</div><div><b>'+esc(o.I)+'</b>Miolo</div><div><b>'+esc(o.L)+'</b>Lábia</div></div>'
   +'<details><summary>Perícias, talentos, magias e itens</summary>'
   +'<p><b>Perícias:</b> '+esc(o.pe||"—")+'</p>'
   +'<p><b>Talentos:</b><br>'+esc(o.ta||"—").replace(/\n/g,"<br>")+'</p>'
   +'<p><b>Magias:</b> '+(mag||"—")+'</p>'
   +'<p><b>Itens:</b> '+(it||"—")+" · Cobres "+esc(o.co)+'</p></details></div>'}

 window.OBdraw=function(){
  var el=document.getElementById("appO");if(!el)return;
  var ids=Object.keys(ob.fichas).sort(function(a,b){return String(ob.fichas[a].n||"").localeCompare(String(ob.fichas[b].n||""))});
  var h='<h2>Mesa</h2><div class="hint">Fichas dos jogadores, atualizadas em tempo real. Aqui você só vê; cada jogador edita a sua.</div>';
  h+=ids.map(function(id){return card(ob.fichas[id])}).join("")||'<p class="hint">Nenhum jogador compartilhou uma ficha ainda.</p>';
  var sem=ob.players.filter(function(p){return !ob.fichas[p.id]}).map(function(p){return esc(p.name||"Jogador")});
  if(sem.length)h+='<p class="hh" style="margin-top:12px">Sem ficha compartilhada: '+sem.join(", ")+".</p>";
  h+='<p class="hh">Espaço da sala usado por todas as extensões: '+(ob.bytes/1000).toFixed(1)+" de 16 kB ("+Math.round(ob.bytes/LIM*100)+"%)."+(ob.bytes/LIM>=.75?" Perto do limite: peça para enxugar textos longos.":"")+"</p>";
  el.innerHTML=h};

 /* rolagens aparecem como aviso para o resto da mesa */
 window.OBroll=function(t,n1){if(!ob.pronto)return;try{OBR.broadcast.sendMessage(CH,{t:String(t).slice(0,240),n:!!n1})}catch(e){}};

 function iniciar(){
  var O=window.OBR;
  if(O&&O.default&&!O.onReady)O=window.OBR=O.default;
  if(!O||!O.onReady||O.isAvailable===false)return;
  O.onReady(function(){
   ob.id=O.player.id;
   Promise.all([O.player.getRole(),O.player.getName(),O.room.getMetadata(),O.party.getPlayers().catch(function(){return[]})]).then(function(r){
    ob.gm=r[0]==="GM";ob.nome=r[1]||"";ob.players=r[3]||[];
    lerMeta(r[2]);restaurar();
    ob.pronto=true;
    drawTop();OBpush();
    O.room.onMetadataChange(lerMeta);
    O.player.onChange(function(p){
     var g=p.role==="GM",mudou=g!==ob.gm;ob.gm=g;ob.nome=p.name||ob.nome;
     if(mudou){if(!g&&topTab==="o")topTab="f";drawTop();if(g&&topTab==="o")OBdraw()}});
    O.party.onChange(function(l){ob.players=l||[];if(topTab==="o")OBdraw()});
    O.broadcast.onMessage(CH,function(ev){var d=ev&&ev.data;if(d&&d.t)O.notification.show(String(d.t).slice(0,240),d.n?"WARNING":"DEFAULT")});
    try{var ap=function(t){document.documentElement.setAttribute("data-theme",String(t.mode).toLowerCase())};O.theme.getTheme().then(ap);O.theme.onChange(ap)}catch(e){}
   }).catch(function(e){toastL("Não consegui ler os dados da sala.")})})}

 function carregar(i){
  if(window.OBR&&(window.OBR.onReady||window.OBR.default))return iniciar();
  if(i>=SDKS.length)return;
  var sc=document.createElement("script");sc.src=SDKS[i];
  sc.onload=iniciar;sc.onerror=function(){carregar(i+1)};
  document.head.appendChild(sc)}
 carregar(0);
})();
</script></body></html>
